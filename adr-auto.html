
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郵便番号から住所を表示</title>
  <style>
    body {
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      background: #f0f8ff;
      padding: 2em;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background-color: #fff;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5em;
    }
    label {
      display: block;
      margin-top: 1em;
      font-weight: bold;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.8em;
      margin-top: 0.5em;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📮 郵便番号から住所を表示</h2>

    <label for="zipcode">郵便番号（例：2790001）</label>
    <input type="text" id="zipcode" placeholder="例：2790001" maxlength="8">

    <label for="address">住所</label>
    <input type="text" id="address" placeholder="住所がここに表示されます">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const zipInput = document.getElementById("zipcode");
      const addressInput = document.getElementById("address");

      // blurイベントではなく、inputイベントを使用することで、入力中に自動で処理を実行します。
      zipInput.addEventListener("input", function () {
        const zip = zipInput.value.replace(/[^0-9]/g, "");
        
        // 郵便番号が7桁になったらAPIを呼び出します。
        if (zip.length === 7) {
          fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${zip}`)
            .then(response => response.json())
            .then(data => {
              if (data.results) {
                const result = data.results[0];
                const fullAddress = `${result.address1}${result.address2}${result.address3}`;
                addressInput.value = fullAddress;
              } else {
                addressInput.value = "住所が見つかりませんでした。";
              }
            })
            .catch(error => {
              console.error("通信エラー:", error);
              addressInput.value = "通信エラーが発生しました。";
            });
        }
      });
    });
  </script>

</body>
</html>
